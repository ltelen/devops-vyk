{{- if .Values.mysql.deployment.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infrastructure.labels" . | nindent 4 }}
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.mysql | quote }}
spec:
  replicas: {{ .Values.mysql.deployment.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
      app.kubernetes.io/component: database
  strategy:
    type: {{ .Values.mysql.deployment.strategy }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: mysql
          image: "{{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.tag }}"
          imagePullPolicy: {{ .Values.mysql.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.mysql.service.port }}
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: root-password
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: password
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: database
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: mysql-config
              mountPath: /etc/mysql/conf.d
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
                - -u
                - root
                - -p$(MYSQL_ROOT_PASSWORD)
            initialDelaySeconds: {{ .Values.mysql.deployment.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.mysql.deployment.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.mysql.deployment.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.mysql.deployment.resources | nindent 12 }}
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: {{ .Values.mysql.dataPvc.name }}
        - name: mysql-config
          configMap:
            name: mysql-config
{{- end }}

{{- if .Values.mysql.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infrastructure.labels" . | nindent 4 }}
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.mysql | quote }}
spec:
  type: {{ .Values.mysql.service.type }}
  ports:
    - port: {{ .Values.mysql.service.port }}
      targetPort: {{ .Values.mysql.service.port }}
      name: mysql
  selector:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
{{- end }}