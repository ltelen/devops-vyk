{{- if .Values.backup.cronjob.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.backup.cronjob.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infrastructure.labels" . | nindent 4 }}
    app.kubernetes.io/name: mysql-backup
    app.kubernetes.io/component: backup
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.backup | quote }}
spec:
  schedule: {{ .Values.backup.cronjob.schedule | quote }}
  concurrencyPolicy: {{ .Values.backup.cronjob.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.backup.cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.backup.cronjob.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.backup.cronjob.backoffLimit }}
      ttlSecondsAfterFinished: {{ .Values.backup.cronjob.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mysql-backup
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: mysqldump
              image: "{{ .Values.backup.cronjob.image.repository }}:{{ .Values.backup.cronjob.image.tag }}"
              imagePullPolicy: {{ .Values.backup.cronjob.image.pullPolicy }}
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  BACKUP_FILE="/backups/dump-$(date +%Y%m%d-%H%M%S).sql.gz"
                  echo "==> Starting backup to ${BACKUP_FILE}"
                  MYSQL_PWD="${MYSQL_PASSWORD}" mysqldump \
                    --host=mysql \
                    --user="${MYSQL_USER}" \
                    --no-tablespaces \
                    --databases "${MYSQL_DATABASE}" \
                    --single-transaction \
                    --quick \
                    | gzip > "${BACKUP_FILE}"
                  echo "==> Backup complete: $(du -sh ${BACKUP_FILE})"
                  ls -lh /backups/
              env:
                - name: MYSQL_USER
                  valueFrom:
                    secretKeyRef:
                      name: mysql-credentials
                      key: username
                - name: MYSQL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: mysql-credentials
                      key: password
                - name: MYSQL_DATABASE
                  valueFrom:
                    secretKeyRef:
                      name: mysql-credentials
                      key: database
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
              resources:
                {{- toYaml .Values.backup.cronjob.resources | nindent 16 }}
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: {{ .Values.backup.pvc.name }}
{{- end }}